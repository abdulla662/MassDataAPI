services:
  massdata:
    build:
      context: ./MassDataAPI
      dockerfile: Dockerfile
    ports:
      - "7072:8080"
    volumes:
      - massdata_db:/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DatabasePath=/data/massdata.db
      - SeedCount=1000000
    restart: unless-stopped

volumes:
  massdata_db:
